# 组合包 patch：提供方 + 官方 OAR 工具（默认工具名 subagent_agy，避免与官方 OAR 组合包冲突）。
- insert:
    - id: subagent-agy
      name: dsh-subagent-agy
      config:
        providerName: agy
        command: agy
        permissionMode: yolo
    - id: tool-subagent-oar-agy
      name: "@deepseek-ai/dsh-experimental-tool-subagent-oar"
      config:
        providers:
          agy: agy
        toolName: subagent_agy
